<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Hewan Laut</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom right, #0099cc, #003b6f);
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
      text-shadow: 2px 2px 5px #002033;
    }

    .video-wrapper {
      width: 90%;
      max-width: 900px;
      margin: 25px auto;
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    video {
      width: 100%;
      height: 500px;           /* Dipaksa landscape */
      object-fit: cover;        /* Biar video portrait jadi landscape */
      border-radius: 15px;
    }

    footer {
      margin: 30px 0;
      opacity: 0.8;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <h1>🐬 Video Hewan Laut</h1>

  <div class="video-wrapper">
    <video src="audio/video.mp4" controls></video>
  </div>

  <footer>© 2025 Video Laut • Tema Biru</footer>

</body>
</html>
